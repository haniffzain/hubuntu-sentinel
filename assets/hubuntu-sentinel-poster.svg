<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.46" stop-color="#12204d"/>
      <stop offset="0.76" stop-color="#5a1d74"/>
      <stop offset="1" stop-color="#e15a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53d9ff"/>
      <stop offset="1" stop-color="#8e7dff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font:700 78px 'DejaVu Sans',sans-serif;fill:#fff;letter-spacing:1px}
      .sub{font:400 30px 'DejaVu Sans',sans-serif;fill:#c8d7eb}
      .tag{font:700 31px 'DejaVu Sans',sans-serif;fill:#fff}
      .small{font:400 22px 'DejaVu Sans',sans-serif;fill:#b7c6da}
      .cardh{font:700 24px 'DejaVu Sans',sans-serif;fill:#fff}
      .cardt{font:400 19px 'DejaVu Sans',sans-serif;fill:#c4d0df}
      .status{font:700 23px 'DejaVu Sans',sans-serif;fill:#69f0ae}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1310" cy="160" r="230" fill="#6f58ff" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1450" cy="740" r="330" fill="#ff6b35" opacity="0.12"/>
  <rect x="75" y="70" width="1450" height="760" rx="38" fill="#07111f" opacity="0.62" stroke="#5a77aa" stroke-opacity="0.38"/>

  <g transform="translate(115,120)">
    <path d="M0 36 34 0h70l34 36-34 36H34z" fill="none" stroke="#65e0ff" stroke-width="7"/>
    <circle cx="69" cy="36" r="16" fill="#65e0ff"/>
    <text x="165" y="48" class="title">Hubuntu Sentinel</text>
    <text x="165" y="94" class="sub">Intelligent Network Security Monitor for Linux</text>
  </g>

  <text x="115" y="290" class="tag">See. Understand. Protect.</text>
  <text x="115" y="335" class="small">Local-first monitoring that turns network activity into simple, understandable protection.</text>

  <g transform="translate(115,395)">
    <rect width="300" height="185" rx="24" fill="#0d1b2d" stroke="#35517a"/>
    <circle cx="48" cy="50" r="18" fill="#53d9ff"/>
    <text x="82" y="58" class="cardh">SEE</text>
    <text x="28" y="104" class="cardt">Monitor connections, apps,</text>
    <text x="28" y="136" class="cardt">IP activity and exposure.</text>
  </g>
  <g transform="translate(445,395)">
    <rect width="300" height="185" rx="24" fill="#0d1b2d" stroke="#35517a"/>
    <circle cx="48" cy="50" r="18" fill="#8e7dff"/>
    <text x="82" y="58" class="cardh">DETECT</text>
    <text x="28" y="104" class="cardt">Score unusual behaviour</text>
    <text x="28" y="136" class="cardt">with explainable risk.</text>
  </g>
  <g transform="translate(775,395)">
    <rect width="300" height="185" rx="24" fill="#0d1b2d" stroke="#35517a"/>
    <circle cx="48" cy="50" r="18" fill="#ff9f5a"/>
    <text x="82" y="58" class="cardh">RESPOND</text>
    <text x="28" y="104" class="cardt">Policy-driven review,</text>
    <text x="28" y="136" class="cardt">containment and action.</text>
  </g>
  <g transform="translate(1105,395)">
    <rect width="300" height="185" rx="24" fill="#0d1b2d" stroke="#35517a"/>
    <circle cx="48" cy="50" r="18" fill="#69f0ae"/>
    <text x="82" y="58" class="cardh">STAY SAFE</text>
    <text x="28" y="104" class="cardt">Simple controls for users</text>
    <text x="28" y="136" class="cardt">who are not security experts.</text>
  </g>

  <g transform="translate(115,625)">
    <rect width="880" height="135" rx="24" fill="#0a1525" stroke="#2d4263"/>
    <text x="28" y="42" class="status">● ACTIVE DEVELOPMENT / TECHNICAL PREVIEW</text>
    <text x="28" y="79" class="small">Normal  •  Strict  •  Aggressive protection profiles</text>
    <text x="28" y="111" class="small">SQLite history  •  Risk scoring  •  Incident correlation  •  Policy &amp; response</text>
  </g>

  <g transform="translate(1030,625)">
    <rect width="375" height="135" rx="24" fill="url(#accent)" opacity="0.95"/>
    <text x="34" y="47" class="cardh">Support the project ☕</text>
    <text x="34" y="83" class="cardt" fill="#07111f">buymeacoffee.com/hubuntu</text>
    <text x="34" y="113" class="cardt" fill="#07111f">github.com/haniffzain/hubuntu-sentinel</text>
  </g>

  <text x="115" y="805" class="small">Source development remains private in Hubuntu Core until a stable release.</text>
</svg>
